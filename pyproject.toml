[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvq"
version = "0.1.0"
description = "Research codebase for KV-cache key compression in transformer LLMs (JointQK + baselines)."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["kvq*", "pipelines*"]
exclude = ["tests*", "notebooks*", "logs*", "vendor*", "artifacts*", "notes*", "background*", "paper*"]

[tool.setuptools.package-dir]
"" = "src"
"pipelines" = "pipelines"
